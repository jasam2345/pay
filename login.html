<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login | Payroll India</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1c1ce9",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111121",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/10 bg-white dark:bg-background-dark px-6 md:px-10 py-3 w-full">
<div class="flex items-center gap-4 text-primary">
<div class="size-8 flex items-center justify-center bg-primary/10 rounded-lg">
<span class="material-symbols-outlined text-primary">account_balance_wallet</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight">Payroll India</h2>
</div>
<div class="flex items-center gap-4">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold hover:bg-primary/90 transition-colors">
<span class="truncate">Help Center</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-[440px]">
<!-- Login Card -->
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
<!-- Hero Image Placeholder -->
<div class="w-full h-32 bg-primary/5 flex items-center justify-center border-b border-slate-100 dark:border-slate-800">
<div class="flex flex-col items-center">
<div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-full flex items-center justify-center shadow-sm mb-2 border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-primary text-3xl">domain</span>
</div>
</div>
</div>
<div class="p-8">
<div class="text-center mb-8">
<h1 class="text-slate-900 dark:text-white text-2xl font-bold mb-2">Admin Login</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">Secure Payroll Management System</p>
</div>
<form class="space-y-5">
<!-- Email Input -->
<div>
<label class="block text-slate-700 dark:text-slate-300 text-sm font-medium mb-1.5" for="email">
                                Corporate Email ID
                            </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-11 pr-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="email" placeholder="admin@company.in" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between mb-1.5">
<label class="block text-slate-700 dark:text-slate-300 text-sm font-medium" for="password">
                                    Password
                                </label>
<a class="text-primary text-xs font-semibold hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-11 pr-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 text-primary border-slate-300 rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="ml-2 text-sm text-slate-600 dark:text-slate-400" for="remember">Remember this device</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg">login</span>
</button>
</form>
<!-- Trust/Security Footer -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
<div class="flex items-center justify-center gap-2 text-slate-400 text-xs mb-1">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span>Secure 256-bit SSL Encryption</span>
</div>
<p class="text-slate-400 text-[10px] uppercase tracking-widest">Authorized Personnel Only</p>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center text-slate-500 dark:text-slate-400 text-xs">
<p>© 2024 Payroll India Solutions Pvt. Ltd.</p>
<div class="mt-2 flex justify-center gap-4">
<a class="hover:text-primary" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-primary" href="#">Terms of Service</a>
</div>
</div>
</div>
</main>
<!-- Visual Background Element -->
<div class="fixed top-0 right-0 -z-10 opacity-10">
<svg fill="none" height="400" viewbox="0 0 400 400" width="400" xmlns="http://www.w3.org/2000/svg">
<circle cx="300" cy="100" fill="url(#paint0_radial_1)" r="150"></circle>
<defs>
<radialgradient cx="0" cy="0" gradienttransform="translate(300 100) rotate(90) scale(150)" gradientunits="userSpaceOnUse" id="paint0_radial_1" r="1">
<stop stop-color="#1c1ce9"></stop>
<stop offset="1" stop-color="#1c1ce9" stop-opacity="0"></stop>
</radialgradient>
</defs>
</svg>
</div>
</body></html>
